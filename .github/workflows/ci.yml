name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck Repository
        run: pnpm typecheck:repo

      - name: Check API Conventions
        run: pnpm check:conventions

      - name: Check Generated Artifacts
        run: pnpm check:generated

      - name: Test
        run: pnpm test -- --run

      - name: Build
        run: pnpm build

  package-validation:
    name: Package Validation
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate Published Package Surface
        run: pnpm validate:package


  native-validation:
    name: Native Format Validation
    runs-on: ubuntu-latest
    env:
      GRAPH_NATIVE_PYTHON: ${{ github.workspace }}/.venv-native/bin/python
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/native.txt
      - name: Install Native Python Oracles
        run: |
          python -m venv .venv-native
          .venv-native/bin/python -m pip install -r requirements/native.txt
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Pinned PlantUML Oracle
        run: pnpm setup:native:plantuml
      - name: Install Pinned GraphSON Oracle
        run: pnpm setup:native:graphson
      - name: Validate Native Formats and Converter Coverage
        run: pnpm test:coverage
